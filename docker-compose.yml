# Neo4j for the HierarGraph (scripts/export_neo4j.py, --backend neo4j).
#   docker compose up -d neo4j      # web UI: http://localhost:7474
# Bound to 127.0.0.1 only. Password: NEO4J_PASSWORD from the shell or .env,
# default "legalgraph-local" (local development only).
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: legalgraph-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-legalgraph-local}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    restart: unless-stopped
